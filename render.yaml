services:
  # Express Backend API
  - type: web
    name: skillsphere-api
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter api build
    startCommand: pnpm --filter api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://skillsphere.vercel.app

  # FastAPI ML Service
  - type: web
    name: skillsphere-ml
    env: python
    plan: free
    buildCommand: pip install -r services/ml/requirements.txt
    startCommand: uvicorn services.ml.app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_KEY
        sync: false
      - key: BASE_URL
        value: https://skillsphere-ml.onrender.com
